name: Embedded Validation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated validation suite
        run: python3 test_runner.py

      - name: Generate validation report
        run: python3 report_generator.py

      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            test_results.csv
            test_summary.svg
            VALIDATION_REPORT.md
